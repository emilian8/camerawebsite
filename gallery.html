<html lang="en">
<head>
  <meta charset="UTF-8">

  <style>
    @font-face {font-family: "Sackers Italian";src: url('//static.showit.co/file/Ihf9_JEBQPm1WgsZqiyBMQ/shared/sackers_italian_script-webfont.woff');}
    @font-face {font-family: "Stay Classy";src: url('//static.showit.co/file/JAuTBdRTS7ey3dZ3Oj04Jw/shared/nicky_laatz_-_stay_classy_duo_script-webfont.woff');}
    @font-face {font-family: "Ivy Presto Thin";src: url('//static.showit.co/file/sl8XFck7SFO28Xgpgu0UgQ/shared/ivyprestothin.woff');}
    @font-face {font-family: "IvyPrestoLightItalicDisp";src: url('//static.showit.co/file/QSXNuqieROSeoJP12SFw3A/shared/ivyprestolightitalicdisp.woff');}
  </style>
  <style>
    :root {
      --text: #f6f1ec;
      --ink: #2c211a;
      --paper: #f8f4ef;
      --muted: #d4cdc5;
      --accent: #f1c8b2;
      --shadow: 0 12px 40px rgba(0,0,0,0.25);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Manrope", "Work Sans", "Noto Sans", sans-serif;
      background: var(--paper);
      color: var(--ink);
      min-height: 100vh;
      letter-spacing: 0.01em;
    }
    a { color: inherit; text-decoration: none; }

    .hero {
      position: relative;
      min-height: 74vh;
      display: grid;
      place-items: center;
      padding: 56px 24px 68px;
      overflow: hidden;
      background: #0b0a0a;
      color: var(--text);
    }
    .split-gallery {
      position: absolute;
      inset: 0;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
      padding: clamp(18px, 4vw, 36px) clamp(14px, 3vw, 28px);
      z-index: 0;
    }
    .panel {
      position: relative;
      overflow: hidden;
      border-radius: 20px;
      min-height: 100%;
      isolation: isolate;
    }
    .panel::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(0,0,0,0.35) 0%, rgba(0,0,0,0.45) 100%);
      z-index: 1;
    }
    .panel-layer {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      filter: saturate(0.9);
      transition: opacity 1s ease;
    }
    .panel-layer.next { opacity: 0; }
    .panel.fade .panel-layer.next { opacity: 1; }
    .panel.fade .panel-layer.current { opacity: 0; }

    .vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, rgba(0,0,0,0) 35%, rgba(0,0,0,0.35) 70%, rgba(0,0,0,0.55) 100%);
      z-index: 1;
    }

    header {
      position: absolute;
      top: 32px;
      left: 0;
      right: 0;
      z-index: 3;
      display: flex;
      justify-content: center;
      pointer-events: none;
    }
    .nav {
      display: flex;
      align-items: center;
      gap: clamp(18px, 4vw, 40px);
      pointer-events: auto;
    }
    .brand-mark {
      position: absolute;
      left: clamp(18px, 4vw, 42px);
      top: 18px;
      font-family: "Sackers Italian", "Cinzel", serif;
      font-size: clamp(22px, 3vw, 28px);
      font-weight: 400;
      font-style: normal;
      letter-spacing: 0.08em;
      color: var(--text);
      text-transform: lowercase;
      z-index: 4;
    }
    nav a {
      font-family: "Cinzel", "Sackers Italian", serif;
      color: #f4eee7;
      text-decoration: none;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 6px 4px;
      position: relative;
      transition: color 0.2s ease;
      font-size: 14px;
    }
    nav a:hover { color: #ffffff; }
    nav a.active::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: -6px;
      height: 1px;
      background: #ffffff;
      opacity: 0.8;
    }

    .hero-heading {
      position: relative;
      z-index: 2;
      text-align: center;
      display: grid;
      gap: 10px;
      max-width: 720px;
    }
    .hero-heading .eyebrow {
      margin: 0;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      font-size: 12px;
      color: #d9cfc6;
    }
    .hero-heading h1 {
      margin: 0;
      font-family: "Cinzel", "Sackers Italian", serif;
      font-size: clamp(36px, 5vw, 52px);
      font-weight: 500;
      letter-spacing: 0.03em;
    }
    .hero-heading p {
      margin: 0;
      font-size: 16px;
      color: #e9e1d8;
      font-family: "Noto Sans", "Manrope", sans-serif;
    }

    .section {
      padding: clamp(56px, 12vw, 110px) clamp(18px, 8vw, 96px);
      background: var(--paper);
      color: var(--ink);
    }
    .section.light { background: #ffffff; }

    .gallery {
      display: grid;
      gap: 22px;
    }
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 22px;
    }
    .gallery figure {
      margin: 0;
      position: relative;
      overflow: hidden;
      border-radius: 10px;
      background: #d9d2cb;
      box-shadow: 0 18px 36px rgba(0,0,0,0.08);
      min-height: 240px;
    }
    .gallery img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.7s ease;
      filter: saturate(0.96);
    }
    .gallery figure:hover img { transform: scale(1.03); }
    .full-bleed {
      grid-column: 1 / -1;
      min-height: clamp(260px, 50vw, 480px);
      background: #efe7de;
    }
    .full-bleed img { object-fit: contain; }

    .site-footer {
      padding: 52px clamp(18px, 8vw, 96px) 68px;
      background: #f5f3ef;
      color: #1f1915;
      display: grid;
      gap: 12px;
      text-align: center;
      border-top: 1px solid rgba(0,0,0,0.05);
    }
    .site-footer .name {
      font-family: "Ivy Presto Thin", "Playfair Display", serif;
      font-size: 26px;
      letter-spacing: 0.04em;
      font-weight: 400;
    }
    .site-footer .tagline {
      font-family: "Playfair Display", serif;
      font-size: 16px;
      font-style: italic;
      color: #51443a;
    }
    .site-footer .dash {
      font-family: "Sackers Italian", serif;
      color: #8a7b70;
      letter-spacing: 0.18em;
    }
    .site-footer a {
      color: #1f1915;
      text-decoration: none;
      font-weight: 500;
    }
    .site-footer a:hover { text-decoration: underline; }

    @media (max-width: 640px) {
      .nav { gap: 14px; padding: 12px 18px; }
      nav a { font-size: 13px; padding: 6px 8px; }
    }
  </style>
</head>
<body>
  <div class="hero page-hero">
    <div class="split-gallery" aria-hidden="true">
      <div class="panel left">
        <div class="panel-layer current"></div>
        <div class="panel-layer next"></div>
      </div>
      <div class="panel right">
        <div class="panel-layer current"></div>
        <div class="panel-layer next"></div>
      </div>
    </div>
    <div class="vignette" aria-hidden="true"></div>

    <div class="brand-mark">leis camera</div>

    <header>
      <div class="nav">
        <nav>
          <a href="index.html">Home</a>
          <a href="about.html">About</a>
          <a class="active" href="gallery.html">Gallery</a>
          <a href="pricing.html">Pricing</a>
          <a href="contact.html">Contact</a>
        </nav>
      </div>
    </header>

    <div class="hero-heading">
      <p class="eyebrow">Gallery</p>
      <h1>Perfectly curated for your eyes.</h1>
      <p>Light-drenched portraits, intimate details, and the in-between moments that tell your story.</p>
    </div>
  </div>

  <script>
    const leftImages = [
      "images/family-red-dresses-group.jpg",
      "images/couple-with-dogs-portrait.jpg",
      "images/engagement-closeup-bw.jpg",
      "images/church-ceremony-front.jpg",
      "images/reception-first-dance.jpg"
    ];
    const rightImages = [
      "images/bride-full-length-portrait.jpg",
      "images/wedding-accessories-flatlay.jpg",
      "images/studio-couple-standing.jpg",
      "images/church-recessional-portrait.jpg",
      "images/exterior-couple-bw-walk.jpg"
    ];

    function startPanelRotation(panel, images) {
      if (!panel || images.length === 0) return;
      const layers = panel.querySelectorAll('.panel-layer');
      if (layers.length < 2) return;

      let current = 0;
      let upcoming = images.length > 1 ? 1 : 0;

      layers[0].style.backgroundImage = `url(${images[current]})`;
      layers[1].style.backgroundImage = `url(${images[upcoming]})`;

      setInterval(() => {
        layers[1].style.backgroundImage = `url(${images[upcoming]})`;
        panel.classList.add('fade');

        setTimeout(() => {
          layers[0].style.backgroundImage = layers[1].style.backgroundImage;
          panel.classList.remove('fade');
        }, 1000);

        current = upcoming;
        upcoming = (upcoming + 1) % images.length;
      }, 4800);
    }

    startPanelRotation(document.querySelector('.panel.left'), leftImages);
    startPanelRotation(document.querySelector('.panel.right'), rightImages);
  </script>

  <section class="section light">
    <div class="gallery">
      <div class="gallery-grid">
        <figure>
          <img src="images/bride-full-length-portrait.jpg" alt="Bride portrait outdoors">
        </figure>
        <figure>
          <img src="images/wedding-accessories-flatlay.jpg" alt="Wedding accessories flat lay">
        </figure>
        <figure>
          <img src="images/bridal-editorial-seated.jpg" alt="Editorial bridal portrait">
        </figure>
      </div>

      <div class="gallery-grid">
        <figure class="full-bleed">
          <img src="images/family-red-dresses-group.jpg" alt="Family portrait in coordinated red dresses">
        </figure>
      </div>

      <div class="gallery-grid">
        <figure>
          <img src="images/desert-couple-boulders-portrait.jpg" alt="Couple portrait among Joshua Tree boulders">
        </figure>
        <figure>
          <img src="images/church-recessional-portrait.jpg" alt="Newlyweds walking down the aisle">
        </figure>
        <figure>
          <img src="images/studio-couple-standing.jpg" alt="Minimal studio couple portrait">
        </figure>
      </div>
    </div>
  </section>

  <footer class="site-footer">
    <div class="name">Leilani Camacho</div>
    <div class="tagline">Wedding &amp; Portrait Photographer</div>
    <div class="dash">-</div>
    <div><a href="mailto:leiscameraphotography@gmail.com">leiscameraphotography@gmail.com</a></div>
  </footer>
</body>
</html>

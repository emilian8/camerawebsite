<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery | leiscamera</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Work+Sans:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #1c1815;
      --muted: #4a413a;
      --line: #b2a99f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Work Sans", "Segoe UI", sans-serif;
      background: #fff;
      color: var(--ink);
    }
    a { color: inherit; text-decoration: none; }

    .shell {
      padding: 32px clamp(18px, 8vw, 80px) 80px;
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: clamp(18px, 4vw, 32px);
    }

    .social {
      grid-column: 1 / span 2;
      display: flex;
      gap: 14px;
      align-items: center;
    }
    .icon {
      width: 26px;
      height: 26px;
      display: grid;
      place-items: center;
      border: 1px solid var(--ink);
      border-radius: 6px;
      color: var(--ink);
      transition: transform 0.2s ease, background 0.2s ease;
    }
    .icon:hover { transform: translateY(-2px); background: rgba(0,0,0,0.05); }

    header {
      grid-column: 3 / span 8;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      text-align: center;
      margin-bottom: clamp(40px, 7vw, 64px);
    }
    .brand {
      font-family: "Cormorant Garamond", serif;
      font-size: 28px;
      letter-spacing: 0.02em;
      font-weight: 500;
    }
    nav {
      display: flex;
      gap: clamp(18px, 3vw, 34px);
      font-family: "Cormorant Garamond", serif;
      font-size: 18px;
    }
    nav a {
      position: relative;
      padding: 6px 4px 10px;
    }
    nav a.active::after, nav a:hover::after {
      content: "";
      position: absolute;
      left: 6px;
      right: 6px;
      bottom: 0;
      height: 2px;
      background: var(--ink);
    }

    .intro {
      grid-column: 1 / -1;
      text-align: center;
      margin: clamp(40px, 12vw, 80px) 0 clamp(36px, 10vw, 70px);
    }
    .intro h1 {
      margin: 0;
      font-family: "Cormorant Garamond", serif;
      font-weight: 500;
      font-size: clamp(34px, 5vw, 42px);
      color: var(--ink);
    }

    .gallery {
      grid-column: 1 / -1;
      display: grid;
      gap: clamp(20px, 4vw, 34px);
    }
    .row {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: clamp(14px, 2vw, 22px);
    }
    .row.single {
      grid-template-columns: 1fr;
    }
    figure {
      margin: 0;
      position: relative;
      overflow: hidden;
      border-radius: 8px;
      background: #e8e2da;
      min-height: clamp(260px, 45vw, 520px);
      box-shadow: 0 22px 42px rgba(0,0,0,0.08);
    }
    img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.7s ease;
    }
    figure:hover img { transform: scale(1.03); }

    @media (max-width: 960px) {
      .shell {
        grid-template-columns: repeat(8, 1fr);
      }
      header { grid-column: 1 / -1; }
      .social { grid-column: 1 / -1; order: -1; }
    }
    @media (max-width: 720px) {
      .shell {
        grid-template-columns: repeat(4, 1fr);
      }
      nav { gap: 16px; font-size: 16px; flex-wrap: wrap; justify-content: center; }
      .row { grid-template-columns: 1fr; }
      figure { min-height: clamp(240px, 60vw, 400px); }
    }

    .site-footer {
      padding: 52px clamp(18px, 8vw, 96px) 68px;
      background: #f5f3ef;
      color: #1f1915;
      display: grid;
      gap: 12px;
      text-align: center;
      border-top: 1px solid rgba(0,0,0,0.05);
    }
    .site-footer .name {
      font-family: "Cormorant Garamond", serif;
      font-size: 26px;
      letter-spacing: 0.01em;
      font-weight: 500;
    }
    .site-footer .tagline {
      font-family: "Cormorant Garamond", serif;
      font-size: 16px;
      font-style: italic;
      color: #51443a;
    }
    .site-footer .dash {
      font-family: "Cormorant Garamond", serif;
      color: #8a7b70;
    }
    .site-footer a {
      color: #1f1915;
      text-decoration: none;
      font-weight: 500;
    }
    .site-footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="shell">
    <div class="social">
      <a class="icon" aria-label="Instagram" href="https://www.instagram.com/leiscamera/">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="5"></rect>
          <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
          <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
        </svg>
      </a>
      <a class="icon" aria-label="Email" href="mailto:leiscameraphotography@gmail.com">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 4h16v16H4z"></path>
          <polyline points="4 6 12 13 20 6"></polyline>
        </svg>
      </a>
    </div>

    <header>
      <a class="brand" href="index.html">leiscamera</a>
      <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a class="active" href="gallery.html">Gallery</a>
        <a href="pricing.html">Pricing</a>
        <a href="contact.html">Contact</a>
      </nav>
    </header>

    <div class="intro">
      <h1>Perfectly curated for your eyes.</h1>
    </div>

    <div class="gallery">
      <div class="row">
        <figure>
          <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1400&q=80" alt="Portrait placeholder">
        </figure>
        <figure>
          <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1400&q=80&sat=-30&crop=focalpoint&fp-x=0.8&fp-y=0.4&fp-z=1.2" alt="Portrait placeholder 2">
        </figure>
      </div>
      <div class="row">
        <figure>
          <img src="https://images.unsplash.com/photo-1487412912498-0447578fcca8?auto=format&fit=crop&w=1400&q=80" alt="Bouquet placeholder">
        </figure>
        <figure>
          <img src="https://images.unsplash.com/photo-1441123694162-e54a981ceba3?auto=format&fit=crop&w=1400&q=80" alt="Couple placeholder">
        </figure>
      </div>
      <div class="row single">
        <figure>
          <img src="https://images.unsplash.com/photo-1504203700686-0f3a654864c7?auto=format&fit=crop&w=1800&q=80" alt="Landscape placeholder">
        </figure>
      </div>
    </div>
  </div>

  <footer class="site-footer">
    <div class="name">Leilani Camacho</div>
    <div class="tagline">Wedding &amp; Portrait Photographer</div>
    <div class="dash">—</div>
    <div><a href="mailto:leiscameraphotography@gmail.com">leiscameraphotography@gmail.com</a></div>
  </footer>
</body>
</html>

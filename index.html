<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>leiscamera</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Work+Sans:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --text: #f6f1ec;
      --ink: #2c211a;
      --paper: #f8f4ef;
      --muted: #d4cdc5;
      --accent: #f1c8b2;
      --shadow: 0 12px 40px rgba(0,0,0,0.25);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Work Sans", "Segoe UI", sans-serif;
      color: var(--text);
      background: var(--paper);
      min-height: 100vh;
    }

    .hero {
      position: relative;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 48px 24px;
      overflow: hidden;
      background: #0b0a0a;
      color: var(--text);
    }
    .split-gallery {
      position: absolute;
      inset: 0;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
      padding: clamp(18px, 4vw, 36px) clamp(14px, 3vw, 28px);
      z-index: 0;
    }
    .panel {
      position: relative;
      overflow: hidden;
      border-radius: 20px;
      min-height: 100%;
      isolation: isolate;
    }
    .panel::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(0,0,0,0.35) 0%, rgba(0,0,0,0.45) 100%);
      z-index: 1;
    }
    .panel-layer {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      filter: saturate(0.9);
      transition: opacity 1s ease;
    }
    .panel-layer.next { opacity: 0; }
    .panel.fade .panel-layer.next { opacity: 1; }
    .panel.fade .panel-layer.current { opacity: 0; }

    .vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, rgba(0,0,0,0) 35%, rgba(0,0,0,0.35) 70%, rgba(0,0,0,0.55) 100%);
      z-index: 1;
    }

    header {
      position: absolute;
      top: 32px;
      left: 0;
      right: 0;
      z-index: 3;
      display: flex;
      justify-content: center;
      pointer-events: none;
    }
    .nav {
      display: flex;
      align-items: center;
      gap: clamp(18px, 4vw, 40px);
      pointer-events: auto;
    }
    .brand-mark {
      position: absolute;
      left: clamp(18px, 4vw, 42px);
      top: 18px;
      font-family: "Cormorant Garamond", serif;
      font-size: clamp(22px, 3vw, 28px);
      font-weight: 600;
      font-style: italic;
      letter-spacing: 0.08em;
      color: var(--text);
      text-transform: lowercase;
      z-index: 4;
    }
    nav a {
      font-family: "Work Sans", "Segoe UI", sans-serif;
      color: #f4eee7;
      text-decoration: none;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 6px 4px;
      position: relative;
      transition: color 0.2s ease;
    }
    nav a:hover { color: #ffffff; }
    nav a.active::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: -6px;
      height: 1px;
      background: #ffffff;
      opacity: 0.8;
    }

    .logo-mark {
      position: relative;
      z-index: 2;
      width: clamp(140px, 16vw, 190px);
      height: clamp(140px, 16vw, 190px);
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.6);
      display: grid;
      place-items: center;
      backdrop-filter: blur(4px);
      background: rgba(0,0,0,0.25);
      letter-spacing: 0.12em;
      font-family: "Cormorant Garamond", serif;
      font-weight: 600;
      font-size: clamp(58px, 8vw, 78px);
    }
    .logo-mark::before,
    .logo-mark::after {
      content: "";
      position: absolute;
      height: 1px;
      width: clamp(90px, 10vw, 120px);
      background: rgba(255,255,255,0.45);
      left: 50%;
      transform: translateX(-50%);
    }
    .logo-mark::before { top: 12px; }
    .logo-mark::after { bottom: 12px; }

    .section {
      padding: clamp(56px, 12vw, 110px) clamp(18px, 8vw, 96px);
      background: var(--paper);
      color: var(--ink);
    }
    .section.light {
      background: #ffffff;
    }
    .intro {
      text-align: center;
      display: grid;
      gap: 12px;
    }
    .intro h2 {
      margin: 0;
      font-family: "Cormorant Garamond", serif;
      font-size: clamp(32px, 5vw, 42px);
      font-weight: 500;
      letter-spacing: 0.01em;
    }
    .intro p {
      margin: 0;
      font-size: 16px;
      color: #5d5046;
    }
    .gallery {
      display: grid;
      gap: 22px;
    }
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 22px;
    }
    .gallery figure {
      margin: 0;
      position: relative;
      overflow: hidden;
      border-radius: 8px;
      background: #d9d2cb;
      box-shadow: 0 18px 36px rgba(0,0,0,0.08);
      min-height: 220px;
    }
    .gallery img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.7s ease;
    }
    .gallery figure:hover img {
      transform: scale(1.03);
    }
    .full-bleed {
      grid-column: 1 / -1;
      min-height: clamp(260px, 50vw, 480px);
    }
    .site-footer {
      padding: 52px clamp(18px, 8vw, 96px) 68px;
      background: #f5f3ef;
      color: #1f1915;
      display: grid;
      gap: 12px;
      text-align: center;
      border-top: 1px solid rgba(0,0,0,0.05);
    }
    .site-footer .name {
      font-family: "Cormorant Garamond", serif;
      font-size: 26px;
      letter-spacing: 0.01em;
      font-weight: 500;
    }
    .site-footer .tagline {
      font-family: "Cormorant Garamond", serif;
      font-size: 16px;
      font-style: italic;
      color: #51443a;
    }
    .site-footer .dash {
      font-family: "Cormorant Garamond", serif;
      color: #8a7b70;
    }
    .site-footer a {
      color: #1f1915;
      text-decoration: none;
      font-weight: 500;
    }
    .site-footer a:hover { text-decoration: underline; }

      @media (max-width: 640px) {
        .nav {
          gap: 14px;
          padding: 12px 18px;
        }
        nav a {
          font-size: 14px;
          padding: 6px 8px;
        }
        .gallery figure {
          border-radius: 6px;
        }
      }
  </style>
</head>
<body>
  <div class="hero">
    <div class="split-gallery" aria-hidden="true">
      <div class="panel left">
        <div class="panel-layer current"></div>
        <div class="panel-layer next"></div>
      </div>
      <div class="panel right">
        <div class="panel-layer current"></div>
        <div class="panel-layer next"></div>
      </div>
    </div>
    <div class="vignette" aria-hidden="true"></div>

    <div class="brand-mark">leis camera</div>

    <header>
      <div class="nav">
        <nav>
          <a class="active" href="index.html">Home</a>
          <a href="about.html">About</a>
          <a href="gallery.html">Gallery</a>
          <a href="pricing.html">Pricing</a>
          <a href="contact.html">Contact</a>
        </nav>
      </div>
    </header>

    <div class="logo-mark" aria-label="Leis Camera monogram">LC</div>
  </div>

  <script>
    const leftImages = [
      "https://images.unsplash.com/photo-1502786129293-79981df4e689?auto=format&fit=crop&w=1200&q=80",
      "https://images.unsplash.com/photo-1487412720507-e7ab37603c6f?auto=format&fit=crop&w=1200&q=80",
      "https://images.unsplash.com/photo-1511288593014-8acb33db1c83?auto=format&fit=crop&w=1200&q=80"
    ];
    const rightImages = [
      "https://images.unsplash.com/photo-1500534314209-a25ddb2bd429?auto=format&fit=crop&w=1200&q=80",
      "https://images.unsplash.com/photo-1464375117522-1311d6a5b81f?auto=format&fit=crop&w=1200&q=80",
      "https://images.unsplash.com/photo-1500534319171-ffd14cf6a315?auto=format&fit=crop&w=1200&q=80"
    ];

    function startPanelRotation(panel, images) {
      if (!panel || images.length === 0) return;
      const layers = panel.querySelectorAll('.panel-layer');
      if (layers.length < 2) return;

      let current = 0;
      let upcoming = images.length > 1 ? 1 : 0;

      layers[0].style.backgroundImage = `url(${images[current]})`;
      layers[1].style.backgroundImage = `url(${images[upcoming]})`;

      setInterval(() => {
        layers[1].style.backgroundImage = `url(${images[upcoming]})`;
        panel.classList.add('fade');

        setTimeout(() => {
          layers[0].style.backgroundImage = layers[1].style.backgroundImage;
          panel.classList.remove('fade');
        }, 1000);

        current = upcoming;
        upcoming = (upcoming + 1) % images.length;
      }, 4800);
    }

    startPanelRotation(document.querySelector('.panel.left'), leftImages);
    startPanelRotation(document.querySelector('.panel.right'), rightImages);
  </script>

  <section class="section intro">
    <h2>Leilani Camacho</h2>
    <p>Wedding &amp; Portrait Photographer</p>
    <p>Based in Palm Springs — available wherever your story goes.</p>
  </section>

  <section class="section light">
    <div class="gallery">
      <div class="gallery-grid">
        <figure>
          <img src="https://images.unsplash.com/photo-1500534314209-a25ddb2bd429?auto=format&fit=crop&w=1200&q=80" alt="Tablescape placeholder">
        </figure>
        <figure>
          <img src="https://images.unsplash.com/photo-1511288593014-8acb33db1c83?auto=format&fit=crop&w=1200&q=80" alt="Details placeholder">
        </figure>
      </div>

      <div class="gallery-grid">
        <figure class="full-bleed">
          <img src="https://images.unsplash.com/photo-1499955085172-a104c9463ece?auto=format&fit=crop&w=1600&q=80" alt="Bridal portrait placeholder">
        </figure>
      </div>

      <div class="gallery-grid">
        <figure>
          <img src="https://images.unsplash.com/photo-1487412912498-0447578fcca8?auto=format&fit=crop&w=1200&q=80" alt="Bouquet placeholder">
        </figure>
        <figure>
          <img src="https://images.unsplash.com/photo-1441123100240-f9f3f77ed41b?auto=format&fit=crop&w=1200&q=80" alt="Couple placeholder">
        </figure>
      </div>
    </div>
  </section>

  <footer class="site-footer">
    <div class="name">Leilani Camacho</div>
    <div class="tagline">Wedding &amp; Portrait Photographer</div>
    <div class="dash">—</div>
    <div><a href="mailto:leiscameraphotography@gmail.com">leiscameraphotography@gmail.com</a></div>
  </footer>
</body>
</html>
